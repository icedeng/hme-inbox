# 部署用的 nginx 配置：监听 80，不做 TLS。
#
# 适用于 TLS 在上游终止的场景（Cloudflare 橙云、各家 LB）。
# 它负责两件事：把根路径重写到应用内部的 /m/*，以及**屏蔽访问日志里的路径**。
#
# 日志屏蔽不是可选项：取件 token 就在 URL 路径里，默认的 combined 格式
# 会把它原样写进文件，那样日志的泄露面就等同于全部取件凭证的泄露面。

# 用 $uri 之外的固定串占位；$request 与 $request_uri 都含 token，绝不能用。
log_format hme_safe '$remote_addr "$request_method [路径已屏蔽] $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

# Cloudflare 回源时真实客户端 IP 在 CF-Connecting-IP 里，
# X-Forwarded-For 的首段是 Cloudflare 自己的边缘节点。
map $http_cf_connecting_ip $real_client_ip {
    ''      $remote_addr;
    default $http_cf_connecting_ip;
}

upstream hme_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/hme.access.log hme_safe;

    # 取件长轮询最多等 30 秒，代理超时要留出余量
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 16m;   # jsonl 上传

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $real_client_ip;
    proxy_set_header X-Forwarded-For   $real_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";

    # 应用自身的路径直通，不参与重写
    location /api/  { proxy_pass http://hme_web; }
    location /admin { proxy_pass http://hme_web; }
    location /login { proxy_pass http://hme_web; }
    location /_next/ { proxy_pass http://hme_web; }
    location = /favicon.ico { proxy_pass http://hme_web; access_log off; }

    # 搜索引擎绝不该碰这个站
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 其余全部当取件地址：/{token}/{email}[/...] → /m/{token}/{email}[/...]
    location / {
        rewrite ^/(.+)$ /m/$1 break;
        proxy_pass http://hme_web;
    }
}
